
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincelidades Michi - Taller de Pintura & Artes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-rainbow-red: #E8938D;
            --color-rainbow-orange: #F4B878;
            --color-rainbow-yellow: #F9E4A0;
            --color-rainbow-green: #A8D5BA;
            --color-rainbow-blue: #89B5E2;
            --color-rainbow-purple: #B5A6D3;
            --color-primary: #2B6CB0;
            --color-secondary: #E91E8C;
            --color-dark: #2D3748;
            --color-light: #FFF9F0;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--color-light);
            color: var(--color-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Rainbow decoration */
        .rainbow-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(
                to right,
                var(--color-rainbow-red) 0%,
                var(--color-rainbow-orange) 16.66%,
                var(--color-rainbow-yellow) 33.33%,
                var(--color-rainbow-green) 50%,
                var(--color-rainbow-blue) 66.66%,
                var(--color-rainbow-purple) 83.33%,
                var(--color-rainbow-red) 100%
            );
            z-index: 10000;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 6px;
            left: 0;
            right: 0;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 249, 240, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            opacity: 0;
            animation: fadeInDown 0.8s ease forwards;
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 80px;
            width: auto;
            max-width: 280px;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: var(--color-dark);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            position: relative;
            transition: var(--transition);
            padding: 0.5rem 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(to right, var(--color-primary), var(--color-secondary));
            transition: var(--transition);
            border-radius: 3px;
        }

        nav a:hover {
            color: var(--color-primary);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Hero Section - CENTRADO */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10rem 5% 5rem;
            position: relative;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFE8F0 50%, #E8F4FF 100%);
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(184, 233, 134, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(233, 30, 140, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        .hero-content {
            max-width: 700px;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeInUp 1s ease 0.3s forwards;
            text-align: center;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                transform: translateY(30px);
            }
        }

        .hero h1 {
            font-family: 'Caveat', cursive;
            font-size: clamp(3rem, 7vw, 5.5rem);
            line-height: 1.1;
            color: var(--color-primary);
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 2px 2px 0 rgba(233, 30, 140, 0.1);
        }

        .hero .subtitle {
            font-size: 1.5rem;
            color: var(--color-secondary);
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--color-dark);
            margin-bottom: 3rem;
            line-height: 1.8;
            opacity: 0.9;
        }

        .cta-button {
            display: inline-block;
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            border-radius: 50px;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(43, 108, 176, 0.3);
            border: none;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(43, 108, 176, 0.4);
        }

        /* About Section */
        .about {
            padding: 8rem 5%;
            background: white;
            position: relative;
        }

        .section-title {
            font-family: 'Caveat', cursive;
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: var(--color-primary);
            margin-bottom: 3rem;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--color-rainbow-red), var(--color-rainbow-orange), var(--color-rainbow-yellow), var(--color-rainbow-green), var(--color-rainbow-blue), var(--color-rainbow-purple));
            border-radius: 5px;
        }

        .about-content {
            max-width: 800px;
            font-size: 1.2rem;
            line-height: 1.9;
            color: var(--color-dark);
        }

        /* Gallery Section */
        .gallery {
            padding: 8rem 5%;
            background: linear-gradient(180deg, #FFF9F0 0%, #F0F9FF 100%);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-top: 4rem;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            background: white;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(43, 108, 176, 0.9));
            opacity: 0;
            transition: var(--transition);
            z-index: 1;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .gallery-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #89B5E2 0%, #B5A6D3 50%, #E8938D 100%);
            color: white;
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            font-weight: 700;
        }

        .gallery-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            color: white;
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
            z-index: 2;
        }

        .gallery-item:hover .gallery-info {
            transform: translateY(0);
            opacity: 1;
        }

        .gallery-info h3 {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .gallery-info p {
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 500;
        }

        /* Contact Section */
        .contact {
            padding: 8rem 5%;
            background: linear-gradient(135deg, var(--color-primary) 0%, #1a4d7d 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .contact::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .contact .section-title {
            color: white;
        }

        .contact .section-title::after {
            background: white;
        }

        .contact-content {
            max-width: 700px;
            margin-top: 3rem;
            position: relative;
            z-index: 1;
        }

        .contact-item {
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .contact-item:nth-child(1) { animation-delay: 0.1s; }
        .contact-item:nth-child(2) { animation-delay: 0.2s; }
        .contact-item:nth-child(3) { animation-delay: 0.3s; }

        .contact-item h3 {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: var(--color-rainbow-yellow);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .whatsapp-icon {
            width: 28px;
            height: 28px;
            fill: var(--color-rainbow-yellow);
        }

        .contact-icon {
            width: 28px;
            height: 28px;
            fill: var(--color-rainbow-yellow);
        }

        .contact-item a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: var(--transition);
            display: inline-block;
            font-weight: 500;
        }

        .contact-item a:hover {
            color: var(--color-rainbow-yellow);
            transform: translateX(5px);
        }

        .contact-item p {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.8;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        /* Footer */
        footer {
            padding: 3rem 5%;
            background: #1a3a5c;
            color: white;
            text-align: center;
            font-size: 1rem;
        }

        footer p {
            opacity: 0.8;
        }

        /* Decorative elements */
        .paint-splash {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
        }

        .splash-1 {
            top: 10%;
            left: 5%;
            background: var(--color-rainbow-red);
            animation-delay: 0s;
        }

        .splash-2 {
            top: 60%;
            right: 10%;
            background: var(--color-rainbow-blue);
            animation-delay: 3s;
        }

        .splash-3 {
            bottom: 20%;
            left: 15%;
            background: var(--color-rainbow-green);
            animation-delay: 6s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 0.8rem 5%;
                flex-direction: column;
                gap: 0.8rem;
            }

            .logo-img {
                height: 60px;
                max-width: 220px;
            }

            nav {
                gap: 1rem;
            }

            nav a {
                font-size: 0.9rem;
            }

            .hero {
                padding: 8rem 5% 4rem;
            }

            .hero h1 {
                font-size: 3rem;
            }

            .hero .subtitle {
                font-size: 1.2rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .about, .gallery, .contact {
                padding: 5rem 5%;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .section-title {
